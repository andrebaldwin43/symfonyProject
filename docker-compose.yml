version: '3.8'

services:
  php:
    build:
      context: ./docker/php
    container_name: symfony_php
    volumes:
      - ./symfony:/var/www/html
    networks:
      - symfony-net

  nginx:
    image: nginx:alpine
    container_name: symfony_nginx
    ports:
      - "8080:80"
    volumes:
      - ./symfony:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - symfony-net

  mongo:
    image: mongo:latest
    container_name: symfony_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - symfony-net

volumes:
  mongo_data:

networks:
  symfony-net:
    driver: bridge
